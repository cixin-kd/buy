<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的手機不卡卡網站</title>
</head>
<body>
    <h1>慈幼採購申請</h1>
    <button id="btn">點我呼叫 Google 資料</button>
    <p id="msg">等待點擊...</p>

    <script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbyZEqVrkbap_uI3P3nKv9cXugelsqAhB6UhCgPoh02TNTSQp-y_6iuTuUdZuZUNG7p0cg/exec";

    document.getElementById('btn').onclick = function() {
        document.getElementById('msg').innerText = '正在讀取...';
        
        fetch(scriptUrl)
            .then(res => res.json())
            .then(data => {
                document.getElementById('msg').innerText = data.message + " (時間：" + data.time + ")";
            })
            .catch(err => {
                document.getElementById('msg').innerText = '錯誤：' + err;
            });
    };
</script>
</body>
</html>
